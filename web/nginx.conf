server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API-Calls an den API-Container weiterreichen (Token bleibt serverseitig)
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }

  # SPA-Routing
  location / {
    try_files $uri $uri/ /index.html;
  }
}
